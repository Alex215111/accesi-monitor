# Checks for every pull request. `main` is protected (see README): these checks are required and nothing is pushed to `main` directly.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.30.1
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (hash written here, not fetched from the release)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
      - name: Scan the whole history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --redact --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"
      - run: zizmor .github/workflows

  key-change-guard:
    name: key-change-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A change to the pinned public key is what would let a forged manifest pass, so it waits 24 hours after the pull request was
      # opened. Re-run this job after the wait. `key-change-alert.yml` also opens an issue when such a change reaches `main`.
      - name: Hold changes to keys/ for 24 hours
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          if [ -z "$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- keys/)" ]; then
            echo "keys/ is not touched"
            exit 0
          fi
          age=$(( $(date +%s) - $(date -d "${OPENED_AT}" +%s) ))
          if [ "${age}" -lt 86400 ]; then
            echo "keys/ changed: this pull request must be open for 24 hours first (${age} s so far)" >&2
            exit 1
          fi
          echo "keys/ changed and the 24 hour wait is over"

  manifest-check:
    name: manifest-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify a new manifest against the pinned key and the previous sequence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- manifest/)" ]; then
            echo "manifest/ is not touched"
            exit 0
          fi
          previous=""
          if git cat-file -e "${BASE_SHA}:manifest/manifest.json" 2>/dev/null; then
            git show "${BASE_SHA}:manifest/manifest.json" > "${RUNNER_TEMP}/previous.json"
            previous="${RUNNER_TEMP}/previous.json"
          fi
          node src/check-change.mjs ${previous}
