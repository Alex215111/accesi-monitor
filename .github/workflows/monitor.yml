# Every five minutes: verify the published loader against the signed manifest and, only if everything matches, send the heartbeat.
# An external monitor (Healthchecks.io, period 5 minutes + grace 10 minutes) alerts when the heartbeat stops arriving, so a mismatch,
# a failed run, a run that never started and a disabled workflow all end in the same alert: that is why the alert is "no heartbeat"
# and not "a failed run". Detection objective: 15 minutes (period + grace).
#
# WHO STARTS IT: an external cron (cron-job.org, every 5 minutes) calls `workflow_dispatch` with a fine-grained token limited to this
# repository (Actions: read and write, 90 days). The `schedule` below is only a BACKUP: measured on this repository, GitHub's `*/5`
# schedule ran 4 times in about 13 hours, with gaps from 2 h 24 min to 5 h 34 min, so it cannot be the trigger. GitHub also disables
# scheduled workflows of a public repository after 60 days without activity.
name: Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
# One run at a time. A run that is in progress is NOT cancelled by the next trigger (cancelling it would drop its heartbeat); the
# next one waits, and only the newest waiting run is kept, so triggers from the external cron and from the backup never pile up.
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    name: check (published files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify the manifest and the published files
        run: node src/monitor.mjs
      - name: Send the heartbeat
        env:
          # The only secret of this repository.
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -z "${HEARTBEAT_URL}" ]; then
            echo "HEARTBEAT_URL is not set yet: no heartbeat sent"
            exit 0
          fi
          curl -fsS --retry 3 --max-time 20 --output /dev/null "${HEARTBEAT_URL}"
